# Runs the test suite on every push and pull request.
#
# The point is not the green tick — it is that a change which breaks the
# scoring rubric, the follow-up rules or the per-user isolation gets caught
# before it reaches the deployed app, rather than the next time someone
# happens to run pytest locally.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # A throwaway signing key. The app refuses to start in production
      # without one, and CI must not depend on the real secret.
      JWT_SECRET: ci-only-key-not-used-anywhere-real
      # Left unset deliberately, so the suite runs against SQLite and needs
      # no database service. The ORM makes the two interchangeable, which is
      # the whole reason the storage layer was written this way.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A build failure is the frontend equivalent of a failing test here:
      # it catches import errors and syntax mistakes before they ship.
      - name: Build
        run: npm run build
