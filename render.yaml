# Render.com blueprint — deploys the backend as a free web service.
# Push this repo to GitHub, then in Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: radar-api
    runtime: python
    plan: free
    # Put the API in the same region as the database and near its users.
    # Render defaults to Oregon; with a Neon project in ap-southeast-1 that
    # means every query crosses the Pacific twice, which showed up as roughly
    # 300-600ms added to any request that touches the database.
    # NOTE: region cannot be changed on an existing service — see DEPLOY.md.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Free web services get an ephemeral filesystem, so a SQLite file is
      # wiped on every deploy, restart and cold start. Point this at a hosted
      # Postgres (Neon's free tier works) or accounts will not survive.
      - key: DATABASE_URL
        sync: false
      # Signs the session tokens. Must be set, and must be a long random
      # string — anyone who knows it can mint a token for any account.
      - key: JWT_SECRET
        generateValue: true
      # Makes a missing JWT_SECRET a startup error rather than a silent
      # fallback to the insecure development key.
      - key: RADAR_ENV
        value: production
      # Comma-separated list of the frontend origins allowed to call this API.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false            # set this secret in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
